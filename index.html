<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Frameworks & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --indigo-600: #4f46e5; --slate-900: #0f172a; }

            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);

            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* --- ABACUS STYLES & TOUCH OPTIMIZATION --- */

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        @keyframes pulse-timer {
            0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; }

        .timer-low { animation: pulse-timer 0.5s infinite; }

</head>
<body class="overflow-x-hidden">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="bg-slate-900 text-white p-4 md:px-10 flex flex-col lg:flex-row items-center justify-between shadow-2xl z-50 gap-4">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg border-b-4 border-indigo-800">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M3 3h18v18H3zM3 9h18M9 3v18"/></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black font-space tracking-tighter leading-none uppercase">NUMÉRATION-ENTRAINEMENT</h1>
                    <p class="text-indigo-400 font-bold uppercase tracking-[0.3em] text-[10px] mt-1">CLASSE ADAPTATIVE</p>
                </div>
            </div>
            
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button onclick="setNumPlayers(1)" id="btn-mode-1" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">Individuel</button>
                <button onclick="setNumPlayers(2)" id="btn-mode-2" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">Duel</button>
                <button onclick="setNumPlayers(4)" id="btn-mode-4" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">Équipe</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main id="main-grid" class="flex-1 p-4 grid gap-6 transition-all duration-500">
            <!-- Injecté par JS -->
        </main>

<script>
/** 1. FORMATTAGE NUMÉRIQUE AVEC SUPPORT DÉCIMAL MULTI-RANGS **/
function formatNum(n, commaPos = 0, isDecimals = false) {
    if (typeof n !== 'number' || isNaN(n)) return "0";
    const maxDec = isDecimals ? commaPos : 0;
    return n.toLocaleString('fr-FR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: maxDec
    });
}

/** 2. ALGORITHME PÉDAGOGIQUE D'INTERVALLE STRICT **/
function generatePedagogicalNumber(range, decimalsEnabled, commaPos, isRoman) {
    // Bornage d'intervalle strict (ex: 100 -> [10, 100], 1000 -> [100, 1000])
    const minRange = range >= 1000 ? Math.floor(range / 10) : (range === 100 ? 10 : 1);
    const maxRange = range;

    // Contrainte chiffres romains (1 à 3999)
    if (isRoman) {
        let romanMin = Math.min(minRange, 3999);
        let romanMax = Math.min(maxRange, 3999);
        if (romanMin >= romanMax) romanMin = 1;
        return Math.floor(Math.random() * (romanMax - romanMin + 1)) + romanMin;
    }

    let intPart = 0;
    const isLessThanOne = decimalsEnabled && Math.random() < 0.20;

    if (isLessThanOne) {
        intPart = 0;
    } else {
        const digitsCount = minRange.toString().length;
        const patternType = Math.floor(Math.random() * 4);
        let candidate = 0;

        if (patternType === 0 && digitsCount >= 2) {
            // CAS 1 : Nombres ronds
            const leadLen = Math.random() < 0.5 ? 1 : 2;
            const maxLead = Math.pow(10, Math.min(leadLen, digitsCount)) - 1;
            const leadVal = Math.floor(Math.random() * (maxLead - 1)) + 1;
            candidate = parseInt(leadVal.toString().padEnd(digitsCount, '0'), 10);
        } else if (patternType === 1 && digitsCount >= 3) {
            // CAS 2 : Zéros intercalés
            const first = Math.floor(Math.random() * 9) + 1;
            const last = Math.floor(Math.random() * 9) + 1;
            const zerosCount = digitsCount - 2;
            candidate = parseInt(first + '0'.repeat(zerosCount) + last, 10);
        } else if (patternType === 2 && digitsCount >= 2) {
            // CAS 3 : Chiffres répétés ou séquentiels
            const sub = Math.random();
            if (sub < 0.5) {
                const d = Math.floor(Math.random() * 9) + 1;
                candidate = parseInt(d.toString().repeat(digitsCount), 10);
            } else if (digitsCount <= 4) {
                if (Math.random() < 0.5) {
                    const start = Math.floor(Math.random() * (10 - digitsCount)) + 1;
                    candidate = parseInt(Array.from({length: digitsCount}, (_, i) => start + i).join(''), 10);
                } else {
                    const start = Math.floor(Math.random() * (10 - digitsCount)) + digitsCount - 1;
                    candidate = parseInt(Array.from({length: digitsCount}, (_, i) => start - i).join(''), 10);
                }
            }
        }

        if (!candidate || candidate < minRange || candidate > maxRange) {
            candidate = Math.floor(Math.random() * (maxRange - minRange + 1)) + minRange;
        }
        intPart = candidate;
    }

    if (decimalsEnabled) {
        const decPrecision = Math.floor(Math.random() * commaPos) + 1;
        let decStr = "";
        const decPattern = Math.random();

        if (decPattern < 0.35 && decPrecision >= 2) {
            const zerosCount = Math.floor(Math.random() * (decPrecision - 1)) + 1;
            const endingDigit = Math.floor(Math.random() * 9) + 1;
            decStr = '0'.repeat(zerosCount) + endingDigit + Array(Math.max(0, decPrecision - zerosCount - 1)).fill(0).map(() => Math.floor(Math.random()*10)).join('');
        } else if (decPattern < 0.60) {
            const choices = [5, 25, 50, 75, 125, 500];
            const pick = choices[Math.floor(Math.random() * choices.length)];
            decStr = pick.toString().slice(0, decPrecision).padEnd(decPrecision, '0');
        } else {
            for (let i = 0; i < decPrecision; i++) {
                decStr += Math.floor(Math.random() * 10).toString();
            }
            if (parseInt(decStr, 10) === 0) {
                decStr = decStr.substring(0, decPrecision - 1) + (Math.floor(Math.random() * 9) + 1);
            }
        }

        if (intPart === 0 && parseInt(decStr, 10) === 0) {
            decStr = '0'.repeat(decPrecision - 1) + (Math.floor(Math.random() * 9) + 1);
        }

        let finalVal = parseFloat(intPart + "." + decStr);
        if (finalVal > maxRange) finalVal = maxRange;
        if (finalVal <= 0) finalVal = 0.1;
        return finalVal;
    } else {
        return intPart;
    }
}

/** 3. LOGIQUE MATHÉMATIQUE DE TRADUCTION ET DÉCOMPOSITION **/
const MathUtils = {
    toRoman(n) {
        let intN = Math.floor(n);
        if (intN <= 0 || intN > 3999) return "N/A";
        const map = { M:1000, CM:900, D:500, CD:400, C:100, XC:90, L:50, XL:40, X:10, IX:9, V:5, IV:4, I:1 };
        let res = "";
        for (let i in map) { while (intN >= map[i]) { res += i; intN -= map[i]; } }
        return res;
    },
    toFrench(n, commaPos = 0, isDecimals = false) {
        if (n === 0) return "zéro";
        const units = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf"];
        const teens = ["dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
        const tens = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante-dix", "quatre-vingt", "quatre-vingt-dix"];
        
        const solve99 = (x) => {
            if (x < 10) return units[x];
            if (x < 20) return teens[x-10];
            const q = Math.floor(x/10), r = x%10;
            if (q === 7) return r === 1 ? "soixante-et-onze" : "soixante-" + teens[r];
            if (q === 8) return r === 0 ? "quatre-vingts" : "quatre-vingt-" + units[r];
            if (q === 9) return "quatre-vingt-" + teens[r];
            if (r === 0) return tens[q];
            if (r === 1 && q < 7) return tens[q] + "-et-un";
            return tens[q] + "-" + units[r];
        };
        const solve999 = (x) => {
            if (x < 100) return solve99(x);
            const c = Math.floor(x/100), r = x%100;
            const cPart = c === 1 ? "cent" : units[c] + "-cent" + (r === 0 ? "s" : "");
            return r === 0 ? cPart : cPart + "-" + solve99(r);
        };
        const solveInt = (x) => {
            if (x === 0) return "zéro";
            if (x < 1000) return solve999(x);
            if (x < 1000000) {
                const m = Math.floor(x/1000), r = x%1000;
                const mPart = m === 1 ? "mille" : solve999(m) + "-mille";
                return r === 0 ? mPart : mPart + "-" + solve999(r);
            }
            const mio = Math.floor(x/1000000), r = x%1000000;
            const mioPart = solve999(mio) + (mio > 1 ? "-millions" : "-million");
            return r === 0 ? mioPart : mioPart + "-" + solveInt(r);
        };

        const strVal = (isDecimals && commaPos > 0) ? n.toFixed(commaPos) : n.toString();
        const parts = strVal.split('.');
        let intVal = parseInt(parts[0], 10) || 0;
        let str = solveInt(intVal).replace(/-+/g, "-").replace(/-$/, "");

        if (parts.length > 1 && parseInt(parts[1], 10) > 0) {
            let decDigits = parts[1].split('').map(d => units[parseInt(d, 10)] || 'zéro').join('-');
            str += " virgule " + decDigits;
        }
        return str;
    },
    getDecomposition(n, commaPos = 0, isDecimals = false) {
        const strVal = (isDecimals && commaPos > 0) ? n.toFixed(commaPos) : n.toString();
        const parts = strVal.split('.');
        const sInt = parts[0];
        const sDec = parts[1] || "";
        const adds = [], muls = [];
        
        for(let i=0; i<sInt.length; i++) {
            const d = parseInt(sInt[i]);
            if (d === 0) continue;
            const p = sInt.length - 1 - i;
            const mult = Math.pow(10, p);
            const val = d * mult;
            adds.push(val.toLocaleString('fr-FR'));
            muls.push(`(${d} x ${mult.toLocaleString('fr-FR')})`);
        }
        for(let i=0; i<sDec.length; i++) {
            const d = parseInt(sDec[i]);
            if (d === 0) continue;
            const div = Math.pow(10, -(i + 1));
            const val = d * div;
            adds.push(val.toLocaleString('fr-FR', { maximumFractionDigits: 10 }));
            muls.push(`(${d} x ${div.toLocaleString('fr-FR', { maximumFractionDigits: 10 })})`);
        }
        return { adds: adds.join(" + ") || "0", muls: muls.join(" + ") || "0" };
    }
};

/** 4. ÉTAT GLOBAL **/
let players = 1;
let zones = [];
const OPTION_LABELS = { arabic: "123", roman: "XVI", letters: "ABC", add: "+", mul: "x" };

function initZones(count) {
    zones = Array.from({ length: count }, (_, i) => ({
        id: i,
        cols: new Array(10).fill(0),
        target: 0,
        flipped: false,
        range: 1000,
        mode: 'random',
        type: 'arabic',
        timeLeft: 30,
        decimals: false,
        commaPos: 3,
        opts: { arabic: true, roman: true, letters: true, add: true, mul: true }
    }));
    render();
}

/** 5. BOULIER **/
function handleBead(zIdx, colIdx, rowType, beadIdx) {
    const z = zones[zIdx];
    if (z.flipped) return;
    const val = z.cols[colIdx];
    let up = Math.floor(val/5), low = val%5;
    if (rowType === 'up') {
        const clicked = beadIdx + 1;
        up = clicked > up ? clicked : clicked - 1;
    } else {
        const clicked = beadIdx + 1;
        low = clicked > low ? clicked : clicked - 1;
    }
    z.cols[colIdx] = (up * 5) + low;
    render();
}

function calculateValue(cols, commaPos = 0, decimals = false) {
    const decPos = decimals ? commaPos : 0;
    let total = 0;
    for (let i = 0; i < cols.length; i++) {
        const power = (9 - i) - decPos;
        total += cols[i] * Math.pow(10, power);
    }
    return parseFloat(total.toFixed(decPos));
}

function valueToCols(target, commaPos, decimals) {
    const decPos = decimals ? commaPos : 0;
    const cols = new Array(10).fill(0);
    const parts = target.toString().split('.');
    const intStr = parts[0];
    const decStr = parts[1] || '';

    const intSplitCol = 9 - decPos;
    for (let i = 0; i < intStr.length; i++) {
        const colIdx = intSplitCol - (intStr.length - 1 - i);
        if (colIdx >= 0 && colIdx < 10) {
            cols[colIdx] = parseInt(intStr[i], 10);
        }
    }
    for (let i = 0; i < decStr.length; i++) {
        const colIdx = intSplitCol + 1 + i;
        if (colIdx >= 0 && colIdx < 10) {
            cols[colIdx] = parseInt(decStr[i], 10);
        }
    }
    return cols;
}

/** 6. ACTIONS ET LANCEMENT DE DÉFIS **/
function generateChallenge(idx) {
    const z = zones[idx];
    
    const pool = [];
    if(z.opts.arabic) pool.push('arabic');
    if(z.opts.letters) pool.push('letters');
    if(z.opts.roman && !z.decimals) pool.push('roman');
    if(z.opts.add) pool.push('add');
    if(z.opts.mul) pool.push('mul');

    z.type = pool[Math.floor(Math.random() * pool.length)] || 'arabic';

    const isRoman = (z.type === 'roman');
    z.target = generatePedagogicalNumber(z.range, z.decimals, z.commaPos, isRoman);

    z.flipped = false;
    z.timeLeft = 30;

    // LES MODES 'RANDOM' ET 'EMPTY' REMPLISSENT LE BOULIER
    if (z.mode === 'random' || z.mode === 'empty') {
        z.cols = valueToCols(z.target, z.commaPos, z.decimals);
    } else {
        z.cols = new Array(10).fill(0);
        if (z.mode === 'dictation') startTimer(idx);
    }
    render();
}

let intervals = {};
function startTimer(idx) {
    if(intervals[idx]) clearInterval(intervals[idx]);
    intervals[idx] = setInterval(() => {
        const z = zones[idx];
        if(!z || z.timeLeft <= 0 || z.flipped) {
            clearInterval(intervals[idx]);
            if(z && z.timeLeft <= 0) { z.flipped = true; render(); }
            return;
        }
        z.timeLeft -= 0.1;
        const bar = document.getElementById(`timer-${idx}`);
        if(bar) bar.style.width = (z.timeLeft / 30 * 100) + "%";
    }, 100);
}

function setNumPlayers(n) {
    players = n;
    ['1','2','4'].forEach(m => {
        const b = document.getElementById(`btn-mode-${m}`);
        if(b) b.className = (m == n) ? "px-5 py-2 rounded-lg text-xs font-black uppercase bg-indigo-600 text-white shadow-lg" : "px-5 py-2 rounded-lg text-xs font-black uppercase text-slate-400 hover:text-white";
    });
    initZones(n);
}

/** 7. RENDU DE L'INTERFACE **/
function render() {
    const grid = document.getElementById('main-grid');
    grid.className = `flex-1 p-4 grid gap-6 ${players === 1 ? 'grid-cols-1 max-w-5xl mx-auto w-full' : players === 2 ? 'grid-cols-1 lg:grid-cols-2' : 'grid-cols-1 md:grid-cols-2 xl:grid-cols-4'}`;

    grid.innerHTML = zones.map((z, idx) => {
        const currentVal = calculateValue(z.cols, z.commaPos, z.decimals);
        return `
        <div class="card-container ${z.flipped ? 'is-flipped' : ''}">
            <div class="card-inner">
                <div class="card-front bg-white border-4 border-slate-300">
                    <!-- Config -->
                    <div class="p-3 bg-slate-50 border-b flex flex-col gap-2">
                        <div class="flex justify-between items-center flex-wrap gap-2">
                            <div class="flex bg-slate-200 p-0.5 rounded-lg gap-0.5 shadow-inner">
                                ${['empty','random','manual','dictation'].map(m => `
                                    <button onclick="zones[${idx}].mode='${m}'; generateChallenge(${idx});" class="px-3 py-1.5 rounded-md text-[9px] font-black uppercase transition-all ${z.mode === m ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500 hover:text-slate-800'}">
                                        ${m === 'empty' ? 'Vide' : m === 'random' ? 'Entraînement' : m === 'manual' ? 'Duel' : 'Sprint'}
                                    </button>
                                `).join('')}
                            </div>
                            <!-- SELECTION DES PLAGES D'INTERVALLES STRICTS (100, 1000, 10000, 1000000, 1000000000) -->
                            <div class="flex gap-0.5">
                                ${[100, 1000, 10000, 1000000, 1000000000].map(r => `
                                    <button onclick="zones[${idx}].range=${r}; generateChallenge(${idx});" class="w-8 h-7 flex items-center justify-center rounded-md text-[8px] font-black border transition-all ${z.range === r ? 'bg-indigo-600 text-white' : 'bg-white text-slate-400'}">
                                        ${r === 100 ? '100' : r < 10000 ? r : r === 10000 ? '10k' : (r/1000000 >= 1000 ? (r/1000000000)+'G' : (r/1000000)+'M')}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- BARRE DE CONTRÔLES DÉCIMAUX ET OPTION TYPES -->
                        <div class="flex flex-wrap items-center gap-2 bg-white p-1 rounded-lg border-2 border-slate-100">
                            <!-- Toggle Décimaux -->
                            <div class="flex items-center gap-1 border-r border-slate-200 pr-2">
                                <button onclick="zones[${idx}].decimals = !zones[${idx}].decimals; generateChallenge(${idx});" class="px-2.5 py-1 rounded-md text-[9px] font-black uppercase border transition-all ${z.decimals ? 'bg-red-500 text-white border-red-600 shadow-sm' : 'bg-slate-100 text-slate-500 hover:text-slate-800'}">
                                    Décimaux
                                </button>
                                ${z.decimals ? `
                                    <div class="flex items-center gap-0.5 bg-slate-100 p-0.5 rounded border border-slate-200">
                                        <span class="text-[8px] font-black text-slate-500 px-1">Virgule:</span>
                                        <button onclick="if(zones[${idx}].commaPos > 1){ zones[${idx}].commaPos--; generateChallenge(${idx}); }" class="w-5 h-5 flex items-center justify-center bg-white rounded text-[10px] font-black text-red-600 shadow-sm hover:bg-slate-50">-</button>
                                        <span class="text-[9px] font-black text-red-600 px-1 font-mono">${z.commaPos}</span>
                                        <button onclick="if(zones[${idx}].commaPos < 5){ zones[${idx}].commaPos++; generateChallenge(${idx}); }" class="w-5 h-5 flex items-center justify-center bg-white rounded text-[10px] font-black text-red-600 shadow-sm hover:bg-slate-50">+</button>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="flex-1 flex gap-1 overflow-x-auto scrollbar-hide px-1">
                                ${Object.entries(z.opts).map(([k,v]) => `
                                    <button onclick="zones[${idx}].opts.${k}=${!v}; render();" class="px-2 py-1 rounded-full text-[8px] font-black uppercase border transition-all ${v ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-slate-50 border-slate-100 text-slate-300'}">
                                        ${OPTION_LABELS[k]}
                                    </button>
                                `).join('')}
                            </div>
                            <button onclick="generateChallenge(${idx})" class="h-8 px-4 bg-indigo-600 text-white rounded-lg font-black text-[10px] uppercase border-b-2 border-indigo-800 shadow-md active:translate-y-1">Lancer</button>
                        </div>
                    </div>

                    <!-- Défi -->
                    <div class="p-3">
                        <div class="bg-slate-900 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[90px] relative overflow-hidden shadow-inner">
                            ${z.mode === 'dictation' && z.target > 0 ? `<div id="timer-${idx}" class="absolute top-0 left-0 h-1.5 bg-emerald-500" style="width:${z.timeLeft/30*100}%"></div>` : ''}
                            <h2 class="text-white text-center font-space font-bold ${players === 4 ? 'text-lg' : 'text-3xl'} break-words w-full tracking-tight">
                                ${getChallengeLabel(z)}
                            </h2>
                        </div>
                    </div>

                    <!-- Boulier -->
                    <div class="flex-1 px-4 flex items-center justify-center">
                        <div class="w-full h-full max-h-[350px] bg-[#2d1e12] rounded-[2rem] border-8 border-[#1a120b] shadow-2xl flex p-1.5 overflow-hidden">
                            <div class="flex-1 flex bg-[#fdfaf5] rounded-xl overflow-hidden shadow-inner">
                                ${z.cols.map((v, c) => renderCol(idx, c, v, z)).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Bas -->
                    <div class="p-4 bg-slate-50 border-t flex gap-3">
                        <button onclick="zones[${idx}].flipped=true; render();" class="flex-[3] h-14 bg-emerald-600 border-b-4 border-emerald-800 text-white rounded-xl font-black text-base uppercase shadow-lg active:translate-y-0.5 active:border-b-0">Corriger</button>
                        <button onclick="zones[${idx}].cols=new Array(10).fill(0); render();" class="flex-1 h-14 bg-white text-red-500 border-2 border-red-50 rounded-xl font-black text-[10px] uppercase shadow-sm">Vider</button>
                    </div>
                </div>

                <!-- CORRECTION CALIBRÉE TBI -->
                <div class="card-back border-4 border-dashed border-slate-300 p-5 flex flex-col items-center">
                    <div class="text-center w-full mb-2">
                        <p class="text-slate-400 font-black uppercase text-[9px] tracking-[0.3em] mb-1">Valeur sur le boulier</p>
                        <h3 class="text-6xl font-space font-black tracking-tighter leading-none ${z.mode === 'empty' ? 'text-indigo-600' : (z.target > 0 ? (currentVal === z.target ? 'text-emerald-500' : 'text-red-500') : 'text-indigo-600')}">
                            ${formatNum(currentVal, z.commaPos, z.decimals)}
                        </h3>
                        ${z.mode === 'empty' ? `
                            <div class="mt-2 px-6 py-1.5 rounded-full font-black text-xs uppercase shadow-md inline-block bg-indigo-600 text-white tracking-widest">
                                FICHE IDENTITÉ DU BOULIER
                            </div>
                        ` : (z.target > 0 ? `
                            <div class="mt-2 px-6 py-1.5 rounded-full font-black text-lg uppercase shadow-lg inline-block ${currentVal === z.target ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}">
                                ${currentVal === z.target ? '✓ BRAVO' : '✗ ERREUR'}
                            </div>
                        ` : '')}
                    </div>

                    <div class="flex-1 w-full space-y-2 overflow-y-auto pr-1 scrollbar-hide py-2">
                        ${renderIdentityCard(z)}
                    </div>

                    <button onclick="zones[${idx}].flipped=false; render();" class="mt-3 w-full h-14 bg-slate-900 text-white rounded-xl font-black text-base uppercase shadow-2xl border-b-4 border-slate-950 active:scale-95 transition-transform">Retour</button>
                </div>
            </div>
        </div>
    `}).join('');
}

function renderCol(zIdx, cIdx, val, z) {
    const up = Math.floor(val/5), low = val%5, hasDot = [0,3,6,9].includes(cIdx);
    const isCommaSplit = z.decimals && z.commaPos > 0 && cIdx === (9 - z.commaPos);

    return `
        <div class="flex-1 flex flex-col items-center relative border-x border-slate-200/10">
            <div class="absolute w-1 h-full bg-gradient-to-r from-slate-400 via-slate-100 to-slate-400 left-1/2 -translate-x-1/2"></div>
            
            <!-- PARTIE SUPÉRIEURE (2 perles rouges, valeur 5) -->
            <div class="relative w-full h-[30%] flex flex-col justify-end z-10 px-0.5 pb-1">
                ${[1,0].map(i => `<div onclick="handleBead(${zIdx},${cIdx},'up',${i})" class="bead w-full aspect-[2.4/1] rounded-full shadow-md border border-black/30 ${up > i ? 'bg-red-600' : 'bg-red-950 opacity-80'}" style="transform: translateY(${up > i ? i*2 : -18}px)"></div>`).join('')}
            </div>

            <!-- BARRE CENTRALE NOIRE + VIRGULE MOBILE -->
            <div class="w-full h-3 bg-[#1a120b] z-30 flex items-center justify-center shadow-inner relative">
                ${hasDot ? `<div class="w-1.5 h-1.5 bg-white/90 rounded-full shadow-[0_0_5px_white]"></div>` : ''}
                ${isCommaSplit ? `
                    <div class="absolute -right-3.5 top-1/2 -translate-y-[45%] z-40 text-red-500 font-black text-4xl leading-none drop-shadow-[0_0_10px_rgba(239,68,68,0.95)] pointer-events-none select-none font-mono">
                        ,
                    </div>
                ` : ''}
            </div>

            <!-- PARTIE INFÉRIEURE (5 PERLES BLEUES, valeur 1) -->
            <div class="relative w-full h-[70%] flex flex-col justify-start z-10 px-0.5 pt-1">
                ${[0,1,2,3,4].map(i => `<div onclick="handleBead(${zIdx},${cIdx},'low',${i})" class="bead w-full aspect-[2.4/1] rounded-full shadow-md border border-black/30 ${low > i ? 'bg-blue-600' : 'bg-blue-950 opacity-80'}" style="transform: translateY(${low > i ? -i*2 : 24}px)"></div>`).join('')}
            </div>
        </div>
    `;
}

function getChallengeLabel(z) {
    if (z.mode === 'empty') return '❓ Quel est ce nombre ?';
    if (z.target === 0) return 'PRÊT ?';
    
    const d = MathUtils.getDecomposition(z.target, z.commaPos, z.decimals);
    switch(z.type) {
        case 'roman': return MathUtils.toRoman(z.target);
        case 'letters': return MathUtils.toFrench(z.target, z.commaPos, z.decimals);
        case 'add': return d.adds;
        case 'mul': return d.muls;
        case 'arabic':
        default: return formatNum(z.target, z.commaPos, z.decimals);
    }
}

function renderIdentityCard(z) {
    const currentVal = calculateValue(z.cols, z.commaPos, z.decimals);
    const val = (z.mode === 'empty' || z.target === 0) ? currentVal : z.target;
    const d = MathUtils.getDecomposition(val, z.commaPos, z.decimals);
    let h = "";
    
    const cardClass = "bg-white p-2.5 rounded-xl border-2 border-slate-200 shadow-sm flex flex-col justify-center";
    const titleClass = "text-slate-400 font-black text-[8px] uppercase mb-0.5 tracking-widest leading-none";
    const valueClass = "font-black text-indigo-600 text-2xl font-space leading-tight block";

    if(z.opts.arabic) h += `<div class="${cardClass}"><p class="${titleClass}">Chiffres</p><span class="${valueClass}">${formatNum(val, z.commaPos, z.decimals)}</span></div>`;
    if(z.opts.roman && !z.decimals && val <= 3999) h += `<div class="${cardClass}"><p class="${titleClass}">Romains</p><span class="${valueClass} text-amber-600">${MathUtils.toRoman(val)}</span></div>`;
    if(z.opts.letters) h += `<div class="${cardClass}"><p class="${titleClass}">Lettres</p><span class="font-bold text-slate-800 text-lg leading-tight block">"${MathUtils.toFrench(val, z.commaPos, z.decimals)}"</span></div>`;
    if(z.opts.add) h += `<div class="${cardClass}"><p class="${titleClass}">Addition</p><span class="font-black text-indigo-500 text-lg font-space leading-snug block">${d.adds}</span></div>`;
    if(z.opts.mul) h += `<div class="${cardClass}"><p class="${titleClass}">Multiplication</p><span class="font-black text-emerald-600 text-lg font-space leading-snug block">${d.muls}</span></div>`;
        
    return h;
}

// Initialisation au démarrage
initZones(1);
</script>
</body>
</html>
